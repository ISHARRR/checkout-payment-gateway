[tool.poetry]
name = "payment-gateway-api"
version = "0.1.0"
description = "Payment Gateway API"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
uvicorn = "0.52.4"
fastapi = "0.141.1"
pydantic = "2.13.5"
httpx = "0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
ruff = "0.16.6"

[build-system]
requires = ["poetry-core==2.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the supplied bank simulator (RUN_BANK_INTEGRATION=1)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
